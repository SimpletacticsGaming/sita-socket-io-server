name: pipeline

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version which is used for the build (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  version:
    outputs:
      tag: ${{ steps.tag_generation.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate tag
        id: tag_generation
        run: |
          PIPELINE_NUMBER=${{ github.run_number }}
          EVENT_NAME="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && ( "$REF_NAME" == "main" || "$REF_NAME" == hotfix* || "$REF_NAME" == release* ) ]]; then
            NEW_TAG="${VERSION}"
          else
            NEW_TAG="$(date +'%Y-%m-%d').${PIPELINE_NUMBER}"
          fi
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ inputs.version }}

  build_and_push:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine tag
        run: echo "TAG_NAME=${{ needs.version.outputs.tag }}" >> $GITHUB_ENV
      - name: Print tag
        run: echo "Tag is ${TAG_NAME}"
      - name: Cache npm files
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-npm-files
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list
      - name: Install dependencies
        run: npm install
#      - name: Build
#        run: npm run build
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_REPOSITORY }}/sitasocket:${TAG_NAME} .
      - name: Docker Registry Login
        run: docker login -u ${{ secrets.DOCKER_REGISTRY_USER }} -p ${{ secrets.DOCKER_REGISTRY_PW }} ${{ secrets.DOCKER_REPOSITORY }}
      - name: Push docker image to registry
        run: docker image push ${{ secrets.DOCKER_REPOSITORY }}/sitasocket:${TAG_NAME}
      - name: Docker Registry Logout
        run: docker logout

  create_release:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix') || startsWith(github.ref_name, 'release')) }}
    needs:
      - build_and_push
      - version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Determine release tag
        run: echo "RELEASE_TAG=v${{ needs.version.outputs.tag }}" >> $GITHUB_ENV
      - name: Push new tag
        run: |
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
      - name: Create GitHub Release
        run: gh release create ${RELEASE_TAG} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.ACTION_REPO_SECRET }}
